<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Angel Tech · Criativos Google Ads</title>
<style>
  @font-face { font-family: 'Inter'; src: url(../reels/fonts/Inter.woff2) format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Montserrat'; src: url(../reels/fonts/Montserrat.woff2) format('woff2'); font-weight: 100 900; }
  :root { --noite: #0C1C33; --angel: #1C89DC; --ambar: #F5A623; --branco: #fff; }
  * { box-sizing: border-box; margin: 0; }
  body { background: #222; display: flex; flex-wrap: wrap; gap: 40px; padding: 40px; align-items: flex-start; }

  .criativo {
    position: relative;
    overflow: hidden;
    color: var(--branco);
    font-family: Inter, sans-serif;
    background:
      radial-gradient(circle at 70% 55%, rgba(28,137,220,.22), rgba(28,137,220,0) 60%),
      repeating-linear-gradient(0deg, rgba(28,137,220,.06) 0 2px, transparent 2px calc(var(--s) * 84px)),
      repeating-linear-gradient(90deg, rgba(28,137,220,.06) 0 2px, transparent 2px calc(var(--s) * 84px)),
      var(--noite);
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    padding: calc(var(--s) * 56px) calc(var(--s) * 64px);
    gap: calc(var(--s) * 24px);
  }
  .criativo::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(4,10,20,0) 55%, rgba(4,10,20,.5));
    pointer-events: none;
  }
  .paisagem { width: 1200px; height: 628px; --s: 1; --fone: 520px; }
  .quadrado { width: 1200px; height: 1200px; --s: 1.32; --fone: 780px; }
  .retrato  { width: 960px;  height: 1200px; --s: 1.1; --fone: 680px; }

  .texto { display: flex; flex-direction: column; gap: calc(var(--s) * 18px); z-index: 1; }
  .marca { width: calc(var(--s) * 78px); }
  h1 {
    font: 800 calc(var(--s) * 74px)/.98 Montserrat, sans-serif;
    letter-spacing: -.01em;
  }
  h1 span, .angel { color: var(--angel); }
  .prazo { font: 700 calc(var(--s) * 34px)/1.15 Montserrat, sans-serif; }
  .preco { display: flex; flex-direction: column; }
  .preco small { font: 500 calc(var(--s) * 22px) Inter, sans-serif; opacity: .85; }
  .preco strong { font: 800 calc(var(--s) * 84px)/1 Montserrat, sans-serif; color: var(--ambar); }
  .rodape { font: 500 calc(var(--s) * 19px)/1.4 Inter, sans-serif; opacity: .85; }
  .rodape b { font-weight: 600; opacity: 1; }

  .fone { height: var(--fone); z-index: 1; transform: rotate(6deg); }
  .fone svg { height: 100%; width: auto; display: block; overflow: visible; }

  /* Versão limpa (Performance Max / display responsivo): pouco texto, sem preço. */
  .limpa { grid-template-columns: 1fr; justify-items: center; }
  .limpa .texto { position: absolute; left: calc(var(--s) * 56px); top: calc(var(--s) * 48px); }
  .limpa .texto > :not(.marca) { display: none; }
  .limpa .fone { transform: rotate(0); }
  .limpa .rotulo { display: none; }

  .logo { width: 1200px; height: 1200px; background: var(--noite); display: grid; place-items: center; }
  .logo img { width: 760px; }
</style>
</head>
<body>
<template id="tpl">
  <div class="texto">
    <img class="marca" src="../reels/assets/simbolo.png" alt="">
    <h1>TELA<br><span>QUEBROU?</span></h1>
    <p class="prazo">Troca em 40 minutos.</p>
    <p class="preco"><small>a partir de</small><strong>R$ 190</strong></p>
    <p class="rodape"><b>Garantia de 90 dias por escrito.</b><br>Rua José Antônio Pereira, Ipiranga, São José/SC</p>
  </div>
  <div class="fone"></div>
</template>

<section class="criativo paisagem" id="paisagem-texto"></section>
<section class="criativo quadrado" id="quadrado-texto"></section>
<section class="criativo retrato" id="retrato-texto"></section>
<section class="criativo paisagem limpa" id="paisagem-limpa"></section>
<section class="criativo quadrado limpa" id="quadrado-limpa"></section>
<section class="criativo retrato limpa" id="retrato-limpa"></section>
<section class="logo" id="logo-quadrado"><img src="../reels/assets/logo-vertical.png" alt="Angel Tech"></section>

<script>
// Celular "antes e depois": metade de cima trincada, metade de baixo com tela nova.
function mulberry32(seed) {
  return () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function phoneSvg(uid) {
  const W = 380, H = 780, sx = 20, sy = 20, sw = 340, sh = 740;
  const split = (x) => sy + sh * (0.56 - 0.12 * (x - sx) / sw); // linha diagonal do antes/depois
  const r = mulberry32(7);
  const ix = 230, iy = 220;
  let cracks = '';
  for (let i = 0; i < 12; i++) {
    let a = (i / 12) * Math.PI * 2 + (r() - 0.5) * 0.5, x = ix, y = iy, d = `M${x} ${y}`;
    const len = 160 + r() * 360, segs = 6 + Math.floor(r() * 4);
    for (let s = 0; s < segs; s++) {
      a += (r() - 0.5) * 0.6;
      x += Math.cos(a) * len / segs;
      y += Math.sin(a) * len / segs;
      d += ` L${x.toFixed(1)} ${y.toFixed(1)}`;
    }
    cracks += `<path d="${d}" stroke-width="${(2 + r() * 3).toFixed(1)}"/>`;
  }
  let ring = '';
  for (let i = 0; i <= 14; i++) {
    const a = (i / 14) * Math.PI * 2, rr = 36 + r() * 14;
    ring += `${i ? 'L' : 'M'}${(ix + Math.cos(a) * rr).toFixed(1)} ${(iy + Math.sin(a) * rr).toFixed(1)} `;
  }
  const yl = split(sx), yr = split(sx + sw);
  const top = `M${sx} ${sy} H${sx + sw} V${yr} L${sx} ${yl} Z`;
  const bottom = `M${sx} ${yl} L${sx + sw} ${yr} V${sy + sh} H${sx} Z`;
  const symW = 210, symH = symW * 1250 / 1818;
  const label = (txt, x, y, fill, color) =>
    `<g class="rotulo"><rect x="${x}" y="${y}" width="120" height="40" rx="20" fill="${fill}"/>` +
    `<text x="${x + 60}" y="${y + 27}" text-anchor="middle" font-family="Montserrat" font-weight="800" font-size="18" letter-spacing="2" fill="${color}">${txt}</text></g>`;
  return `
  <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="tela-${uid}"><rect x="${sx}" y="${sy}" width="${sw}" height="${sh}" rx="44"/></clipPath>
      <clipPath id="cima-${uid}"><path d="${top}"/></clipPath>
      <linearGradient id="nova-${uid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1C89DC" stop-opacity=".38"/>
        <stop offset="1" stop-color="#1C89DC" stop-opacity=".1"/>
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="${W}" height="${H}" rx="60" fill="#0C1C33"/>
    <g clip-path="url(#tela-${uid})">
      <rect x="${sx}" y="${sy}" width="${sw}" height="${sh}" fill="rgba(28,137,220,.07)"/>
      <path d="${bottom}" fill="url(#nova-${uid})"/>
      <image href="../reels/assets/simbolo.png" x="${W / 2 - symW / 2}" y="${sy + sh * 0.72 - symH / 2}" width="${symW}" height="${symH}"/>
      <g clip-path="url(#cima-${uid})" fill="none" stroke="rgba(255,255,255,.92)" stroke-linecap="round" stroke-linejoin="round">
        ${cracks}<path d="${ring}" stroke-width="2"/>
      </g>
      <line x1="${sx}" y1="${yl}" x2="${sx + sw}" y2="${yr}" stroke="#fff" stroke-width="5"/>
    </g>
    <rect x="${W / 2 - 58}" y="${sy + 18}" width="116" height="30" rx="15" fill="#0C1C33" stroke="#1C89DC" stroke-width="6"/>
    <rect x="0" y="0" width="${W}" height="${H}" rx="60" fill="none" stroke="#1C89DC" stroke-width="10"/>
    <path d="M${W + 12} 150 V230 M-12 140 V190" stroke="#1C89DC" stroke-width="10" stroke-linecap="round"/>
    ${label('ANTES', -150, 120, '#fff', '#0C1C33')}
    ${label('DEPOIS', -150, 600, '#1C89DC', '#fff')}
  </svg>`;
}

const tpl = document.getElementById('tpl');
document.querySelectorAll('.criativo').forEach((el, i) => {
  el.append(tpl.content.cloneNode(true));
  el.querySelector('.fone').innerHTML = phoneSvg(i);
});

window.pronto = Promise.all([
  document.fonts.load('800 40px Montserrat'),
  document.fonts.load('700 40px Montserrat'),
  document.fonts.load('500 20px Inter'),
  document.fonts.load('600 20px Inter'),
  ...[...document.images].map((img) => img.decode().catch(() => {})),
]).then(() => new Promise((r) => setTimeout(r, 300)));
</script>
</body>
</html>
